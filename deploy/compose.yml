# Production stack on the EC2 host (later the NAS, ADR-0002). It runs the images that CI
# pushed to GHCR; nothing is built here. host-deploy.sh writes the .env next to this file.
# Only Caddy ("web") has open ports; the database and the API are reachable only inside.
services:
  db:
    image: ghcr.io/gitgitrice/squadmeet-db:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ghcr.io/gitgitrice/squadmeet-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The captcha (SCRUM-27), from SSM Parameter Store.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
    # --forwarded-allow-ips: the client IP comes from Caddy's X-Forwarded-For (rate limit per
    # IP, SCRUM-27). Safe here: only Caddy can reach the backend. Caddy replaces the header
    # that a client sends, so a client cannot fake its address.
    # --no-access-log: the access log has the client IP on every line, and Docker keeps logs
    # without a time limit. The privacy page says we keep no IP addresses in logs (SCRUM-28).
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips '*' --no-access-log"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/gitgitrice/squadmeet-frontend:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Caddy keeps the certificate here, so a restart does not ask Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  caddy-data:
  caddy-config:
