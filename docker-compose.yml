# Local development: `docker compose up` starts database, API and frontend.
# Map: http://localhost:5173   API: http://localhost:8000/api/health
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squadmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squadmeet}
      POSTGRES_DB: ${POSTGRES_DB:-squadmeet}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-squadmeet}:${POSTGRES_PASSWORD:-squadmeet}@db:5432/${POSTGRES_DB:-squadmeet}
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
